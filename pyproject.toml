[project]
name = "ideaqueue"
version = "0.1.0"
description = "Run multi-stage pipelines with your own agents, on the machines you choose."
readme = "README.md"
license = "MIT"
authors = [{ name = "Akhmad Mamirov" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
q = "ideaqueue.cli:main"
queue = "ideaqueue.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
